name: Lean R acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, 'acc003-*', 'acceptance-*']
  pull_request:
jobs:
  r-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - name: Install required packages
        run: Rscript --vanilla -e 'install.packages(c("jsonlite","digest","DBI","RSQLite"), repos="https://cloud.r-project.org")'
      - name: Five R suites
        run: Rscript --vanilla tools/run_tests.R . test-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: test-evidence
