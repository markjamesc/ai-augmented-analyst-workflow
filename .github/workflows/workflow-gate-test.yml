name: Workflow Gate Test

on:
  pull_request:
    paths:
      - "workflow-gate/**"
      - "templates/workflow-gate/**"
      - ".github/workflows/workflow-gate-test.yml"
  push:
    branches:
      - workflow-gate-enforcement
      - main
      - portfolio-refresh-20260920
    paths:
      - "workflow-gate/**"
      - "templates/workflow-gate/**"
      - ".github/workflows/workflow-gate-test.yml"

jobs:
  test-workflow-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install gate dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "digest"), repos="https://cloud.r-project.org")'

      - name: Run workflow gate tests
        run: Rscript workflow-gate/tests/test_workflow_gate.R .
