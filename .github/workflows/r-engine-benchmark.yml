name: R Workflow Engine Benchmark

on:
  push:
    branches:
      - benchmark/r-engine-20260923
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::janitor
            any::lubridate
            any::readxl
            any::openxlsx
            any::zoo

      - name: Generate benchmark outputs
        run: Rscript benchmark/generated_engine_output.R

      - name: Run functional assertions
        run: Rscript benchmark/test_generated_output.R

      - name: Audit style and modularity
        run: python benchmark/style_audit.py

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-workflow-engine-benchmark
          path: benchmark/results/
