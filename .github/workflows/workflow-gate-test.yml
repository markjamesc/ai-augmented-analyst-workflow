name: R Gate Tests

on:
  pull_request:
    paths:
      - "workflow-gate/**"
      - "procedure-gate/**"
      - "templates/workflow-gate/**"
      - "templates/procedure-gate/**"
      - "docs/**"
      - "methodology/**"
      - "tools/**"
      - "templates/send_queue.json"
      - "templates/preapproval_sheet.json"
      - "templates/methodology/**"
      - ".github/workflows/workflow-gate-test.yml"
  push:
    branches:
      - workflow-gate-enforcement
      - main
      - portfolio-refresh-20260920
      - "methodology-hardening-*"
      - "regression-acceptance-*"
      - "acceptance-remediation-*"
    paths:
      - "workflow-gate/**"
      - "procedure-gate/**"
      - "templates/workflow-gate/**"
      - "templates/procedure-gate/**"
      - "docs/**"
      - "methodology/**"
      - "tools/**"
      - "templates/send_queue.json"
      - "templates/preapproval_sheet.json"
      - "templates/methodology/**"
      - ".github/workflows/workflow-gate-test.yml"

jobs:
  test-workflow-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: "4.6.1"

      - name: Install gate dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "digest", "purrr", "magrittr"), repos="https://cloud.r-project.org")'

      - name: Run workflow gate tests
        run: Rscript workflow-gate/tests/test_workflow_gate.R .

      - name: Run procedure gate tests
        run: Rscript procedure-gate/tests/test_procedure_gate.R .

      - name: Run methodology contract tests
        run: Rscript methodology/tests/test_methodology.R .

      - name: Run local acceptance tests
        run: Rscript methodology/tests/test_acceptance.R .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema dependency
        run: python -m pip install jsonschema==4.23.0

      - name: Check schema compatibility
        run: python methodology/tests/test_schema.py .

      - name: Acceptance remediation regression
        run: Rscript methodology/tests/test_remediation.R .

      - name: Helper regression
        run: python -m unittest discover -s tools -p "test_acceptance.py"

      - name: Live findings regression
        run: Rscript methodology/tests/test_livefix.R .

      - name: Successor project compatibility regression
        run: Rscript methodology/tests/test_successor.R
